package:
  name: friends-of-itajara
  description: A looper for people with a sample-playing module, a sound
    source and a Mac — the Itajara daemon with a page on it. One app, and a
    face per module (`?face=arbhar` first) that says what the module holds,
    what a loop and a layer become there, and how to start the daemon to
    suit it. Nothing of any pedalboard; every control is a button on the page.
  dependencies:
    - aff
    - aff-promise
    - arrays
    - console
    - effect
    - either
    - foldable-traversable
    - halogen
    - halogen-subscriptions
    - integers
    - itajara-client
    - itajara-surface
    - maybe
    - numbers
    - ordered-collections
    - prelude
    - strings
    - web-dom
    - web-html
    - web-uievents
  build:
    strict: true
  bundle:
    module: Main
    outfile: static/index.js
    platform: browser

workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    # The daemon's client and surface packages, from the itajara repo
    # checked out beside this one.
    itajara-client:
      path: ../itajara/client
    itajara-surface:
      path: ../itajara/surface
    # The looper's MC6 and Twister layouts and its pedal CC table, which the
    # surface's Looper page draws and Quadrat's Loop page acts through.
    itajara-controllers:
      path: ../itajara/controllers
    # Helm: the controllers' device profiles and the one Web MIDI FFI, which
    # the Loop page uses only to watch the Twister through Helm's hub.
    helm:
      path: ../helm
    # Amphora's HTTP API, described once (amphora/api); Quadrat asks its
    # operations through hawser-fetch and writes no path of its own.
    amphora-api:
      path: ../live-coding/amphora/api
    hawser:
      path: ../../purescript-hylograph-libs/purescript-hawser
    hawser-fetch:
      path: ../../purescript-hylograph-libs/purescript-hawser/fetch
    # Identity without a name: a content or a key, as a memorable pair of
    # coloured icons. Extracted from Triggerfish so that a chord set can wear
    # the SAME identity in both places. By path until it earns publishing.
    rebus:
      path: ../../code-typography/rebus
    # The shared widgets: Halogen.Widgets.Statement (0.6.0), the sentence
    # every Quadrat page leads with. By path until 0.6 is released.
    halogen-widgets:
      path: ../../purescript-halogen-widgets
